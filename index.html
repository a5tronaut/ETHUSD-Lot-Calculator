
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Size Calculator</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #020617;
    color: #e5e7eb;
  }

  .container {
    max-width: 480px;
    margin: auto;
    padding: 16px;
  }

  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin-bottom: 16px;
  }

  .card {
    background: #0f172a;
    padding: 16px;
    border-radius: 12px;
  }

  label {
    font-size: 0.85rem;
    opacity: 0.85;
    display: block;
    margin-top: 14px;
  }

  input {
    width: 94%;
    margin-top: 6px;
    padding: 14px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: none;
    outline: none;
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 14px;
    border: none;
    background: #22c55e;
    color: #022c22;
    cursor: pointer;
  }

  .results {
    margin-top: 18px;
    background: #020617;
    padding: 16px;
    border-radius: 12px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 1rem;
  }

  .highlight-lotsize {
    color: #22c55e;
    font-weight: bold;
  }

    .highlight-riskamount {
    color: #cf222e;
    font-weight: bold;
  }

  @media (min-width: 768px) {
    h1 {
      font-size: 1.6rem;
    }
  }
</style>
</head>

<body>
  <div class="container">
    <h1>Lot Size Calculator</h1>

    <div class="card">
      <label>Trading Pair</label>
      <select id="pair" style="width:100%;padding:14px;border-radius:10px;border:none;font-size:1.05rem;outline:none;margin-top:6px;">
        <option value="BTCUSD">BTCUSD</option>
        <option value="ETHUSD">ETHUSD</option>
      </select>
      <label>Account Balance (USD)</label>
      <input type="number" id="balance" inputmode="decimal" placeholder="1000">

      <label>Risk per Trade (%)</label>
      <input type="number" id="risk" inputmode="decimal" placeholder="1">

      <label>Entry Price (USD)</label>
      <input type="number" id="price" inputmode="decimal" placeholder="2000">

      <label>Stop Loss (Pips)</label>
      <input type="number" id="stoploss" inputmode="decimal" placeholder="50">

      <label>Leverage (x)</label>
      <input type="number" id="leverage" inputmode="numeric" placeholder="20">

      <button onclick="calculate()">Calculate</button>
    </div>

    <div class="results" id="output" style="display:none;"></div>
  </div>

<script>
function calculate() {
  const balance = +document.getElementById("balance").value;
  const riskPercent = +document.getElementById("risk").value;
  const price = +document.getElementById("price").value;
  const stopLoss = +document.getElementById("stoploss").value;
  const leverage = +document.getElementById("leverage").value;
  const pair = document.getElementById("pair").value;

  if (!balance || !riskPercent || !price || !stopLoss || !leverage) return;

  const riskAmount = balance * (riskPercent / 100);
  const positionSize = riskAmount / stopLoss;

  let lots, margin, unit;
  
  if (pair === "ETHUSD") {
    unit = "ETH";
    lots = positionSize / 0.01;  // original ETH lot sizing untouched
    margin = (positionSize * price) / leverage;
  }

  if (pair === "BTCUSD") {
    unit = "BTC";
    lots = positionSize / 0.001; // 1 Lot = 0.001 BTC (your rule)
    margin = (positionSize * price) / leverage;
  }

  const output = document.getElementById("output");
  output.style.display = "block";
  output.innerHTML = `
    <div class="row">
      <span>Risk Amount</span>
      <span class="highlight-riskamount">$${riskAmount.toFixed(2)}</span>
    </div>
    <div class="row">
      <span>Position Size</span>
      <span>${positionSize.toFixed(4)} ${unit}</span>
    </div>
    <div class="row">
      <span>Lot Size</span>
      <span class="highlight-lotsize">${Math.floor(lots)} Lots</span>
    </div>
    <div class="row">
      <span>Margin Required</span>
      <span>$${margin.toFixed(2)}</span>
    </div>
  `;
}
</script>

</body>
</html>
