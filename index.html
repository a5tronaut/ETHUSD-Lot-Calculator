<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lot Size Calculator</title>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #020617;
        color: #e5e7eb;
      }

      .container {
        max-width: 480px;
        margin: auto;
        padding: 16px;
      }

      h1 {
        text-align: center;
        font-size: 1.4rem;
        margin-bottom: 16px;
      }

      .card {
        background: #0f172a;
        padding: 16px;
        border-radius: 12px;
      }

      label {
        font-size: 0.85rem;
        opacity: 0.85;
        display: block;
        margin-top: 14px;
      }

      input {
        width: 94%;
        margin-top: 6px;
        padding: 14px;
        font-size: 1.05rem;
        border-radius: 10px;
        border: none;
        outline: none;
      }

      button {
        width: 100%;
        margin-top: 18px;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 14px;
        border: none;
        background: #22c55e;
        color: #022c22;
        cursor: pointer;
      }

      .results {
        margin-top: 18px;
        background: #020617;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid #1e293b;
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 1rem;
        padding: 10px 0;
        border-bottom: 1px solid #1e293b;
      }

      .row:last-child {
        border-bottom: none;
      }

      .row span:first-child {
        color: #94a3b8;
        font-size: 0.9rem;
      }

      .highlight-lotsize {
        color: #a78bfa;
        font-weight: bold;
        font-size: 1.15rem;
        background: rgba(167, 139, 250, 0.15);
        padding: 4px 10px;
        border-radius: 8px;
      }

      .highlight-riskamount {
        color: #ef4444;
        font-weight: bold;
      }

      @media (min-width: 768px) {
        h1 {
          font-size: 1.6rem;
        }
      }

      .disclaimer {
        margin-top: 14px;
        padding: 12px;
        font-size: 0.75rem;
        line-height: 1.4;
        color: #94a3b8;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 10px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Lot Size Calculator</h1>

      <div class="card">
        <label>Trading Pair</label>
        <select
          id="pair"
          style="
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 1.05rem;
            outline: none;
            margin-top: 6px;
          "
        >
          <option value="BTCUSD">BTCUSD</option>
          <option value="ETHUSD">ETHUSD</option>
        </select>
        <label>Trade Direction</label>
        <select
          id="direction"
          style="
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 1.05rem;
            outline: none;
            margin-top: 6px;
          "
        >
          <option value="long">Long</option>
          <option value="short">Short</option>
        </select>
        <label>Account Balance (USD)</label>
        <input
          type="number"
          id="balance"
          inputmode="decimal"
          placeholder="1000"
        />

        <label>Risk per Trade (%)</label>
        <input type="number" id="risk" inputmode="decimal" placeholder="1" />

        <label>Entry Price (USD)</label>
        <input
          type="number"
          id="price"
          inputmode="decimal"
          placeholder="2000"
        />

        <label>Stop Loss (Pips)</label>
        <input
          type="number"
          id="stoploss"
          inputmode="decimal"
          placeholder="50"
        />

        <label>Leverage (x)</label>
        <input
          type="number"
          id="leverage"
          inputmode="numeric"
          placeholder="20"
        />

        <button onclick="calculate()">Calculate</button>
      </div>

      <div class="results" id="output" style="display: none"></div>
      <div class="disclaimer">
        ⚠️ Disclaimer: Calculations are estimates only. This tool does not
        provide financial advice. Trading involves high risk, including total
        capital loss. Always verify with your exchange and trade at your own
        risk.
      </div>
    </div>

    <script>
      function calculate() {
        console.clear();
        console.log("=== Lot Size Calculator Debug ===");

        const balance = +document.getElementById("balance").value;
        const riskPercent = +document.getElementById("risk").value;
        const entryPrice = +document.getElementById("price").value;
        const stopDistance = +document.getElementById("stoploss").value;
        const leverageInput = +document.getElementById("leverage").value;
        const pair = document.getElementById("pair").value;
        const direction = document.getElementById("direction").value;
        const rr = 1;

        console.log("Inputs:", {
          balance,
          riskPercent,
          entryPrice,
          stopDistance,
          leverageInput,
          pair,
          direction,
          rr,
        });

        if (
          !balance ||
          !riskPercent ||
          !entryPrice ||
          !stopDistance ||
          !leverageInput ||
          !rr
        ) {
          console.warn("Missing input — calculation aborted");
          return;
        }

        const riskAmount = balance * (riskPercent / 100);
        console.log("Risk Amount:", riskAmount);

        const positionSize = riskAmount / stopDistance;
        console.log("Position Size:", positionSize);

        const notional = positionSize * entryPrice;
        console.log("Notional Value:", notional);

        let lots, unit;

        if (pair === "ETHUSD") {
          unit = "ETH";
          lots = positionSize / 0.01;
        }

        if (pair === "BTCUSD") {
          unit = "BTC";
          lots = positionSize / 0.001;
        }

        console.log("Unit:", unit);
        console.log("Lots:", lots);

        const MMR = 0.005; // 0.5% maintenance margin (typical)
        const FEE_RATE = 0.0005; // 0.05% taker fee (one side)

        const requiredMaxLoss = riskAmount * 2; // safety buffer
        const maxAllowedLeverage =
          notional / (requiredMaxLoss + notional * MMR);

        const leverage = Math.min(leverageInput, maxAllowedLeverage);
        const initialMargin = notional / leverage;
        const maintenanceMargin = notional * MMR;
        const maxLoss = initialMargin - maintenanceMargin;

        let stopLossPrice, takeProfitPrice, liquidationPrice;

        if (direction === "long") {
          stopLossPrice = entryPrice - stopDistance;
          takeProfitPrice = entryPrice + stopDistance * rr;
          liquidationPrice = entryPrice - maxLoss / positionSize;
        } else {
          stopLossPrice = entryPrice + stopDistance;
          takeProfitPrice = entryPrice - stopDistance * rr;
          liquidationPrice = entryPrice + maxLoss / positionSize;
        }

        console.log("Stop Loss Price:", stopLossPrice);
        console.log("Take Profit Price:", takeProfitPrice);
        console.log("Liquidation Price:", liquidationPrice);

        // === Trading Fee (0.05% buy + 0.05% sell and 18% GST) ===
        const entryFee = notional * FEE_RATE;
        const exitFee = takeProfitPrice * positionSize * FEE_RATE;
        const gst = (entryFee + exitFee) * 0.18;
        const totalFees = entryFee + exitFee + gst; // incl GST
        const margin = notional / leverageInput;
        console.log("Margin Required:", margin);
        const marginWithFees = margin + totalFees;
        console.log("Margin Required (inc. Fees):", marginWithFees);

        console.log("Entry Fee:", entryFee);
        console.log("Exit Fee:", exitFee);
        console.log("GST on Fees:", gst);
        console.log("Total Trading Fees (inc. GST):", totalFees);

        const rrProfitUSD = riskAmount * rr;
        console.log("RR Profit (Gross USD):", rrProfitUSD);

        const netPnL = rrProfitUSD - totalFees;
        console.log("Net PnL After Fees:", netPnL);

        const liquidationInvalid =
          (direction === "long" && liquidationPrice >= stopLossPrice) ||
          (direction === "short" && liquidationPrice <= stopLossPrice);

        console.log("Leverage Warning Triggered:", liquidationInvalid);

        let leverageWarning = "";
        if (liquidationInvalid) {
          leverageWarning = `
      <div style="margin-bottom:12px;padding:12px;border-radius:10px;background:#7f1d1d;color:#fecaca;font-weight:bold;text-align:center;">
        ⚠️ Leverage too high — Liquidation is closer than Stop Loss
      </div>
    `;
        }

        const output = document.getElementById("output");
        output.style.display = "block";
        output.innerHTML = `
    ${leverageWarning}

    <div class="row">
      <span>Trade Direction</span>
      <span>${direction.toUpperCase()}</span>
    </div>

    <div class="row">
      <span>Risk Amount</span>
      <span class="highlight-riskamount">$${riskAmount.toFixed(2)}</span>
    </div>

    <div class="row">
      <span>Position Size</span>
      <span>${positionSize.toFixed(4)} ${unit}</span>
    </div>

    <div class="row">
      <span>Lot Size</span>
      <span class="highlight-lotsize">${Math.floor(lots)} Lots</span>
    </div>

    <div class="row">
      <span>Margin Required</span>
      <span>$${marginWithFees.toFixed(2)}</span>
    </div>
  `;
      }
    </script>
  </body>
</html>
